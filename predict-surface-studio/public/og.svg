  <g transform="translate(80, 512)" font-family="'JetBrains Mono',monospace" font-size="17">
    <rect x="0" y="0" width="190" height="38" rx="10" fill="#0d0f15" stroke="#1c2330"/>
    <text x="20" y="25" fill="#8ac4ff">Sui testnet · live</text>
    <rect x="206" y="0" width="232" height="38" rx="10" fill="#0d0f15" stroke="#1c2330"/>
    <text x="226" y="25" fill="#9aa4b4">predict.smartcodedbot.com</text>
    <rect x="454" y="0" width="232" height="38" rx="10" fill="#0d0f15" stroke="#1c2330"/>
    <text x="474" y="25" fill="#9aa4b4">Sui Overflow 2026</text>
  </g>
